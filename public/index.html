<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PulseCP — Contest Notification Engine</title>
  
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>

  <!-- Google Inter Font & Lucide Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(51, 65, 85, 0.5); }
    .glow-effect { box-shadow: 0 0 25px -5px rgba(99, 102, 241, 0.2); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white pb-20">

  <!-- Top Navigation Bar -->
  <header class="sticky top-0 z-50 glass-card border-b border-slate-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center glow-effect shadow-indigo-500/30">
        <i data-lucide="zap" class="w-5 h-5 text-white"></i>
      </div>
      <div>
        <h1 class="font-bold text-base leading-tight tracking-tight flex items-center gap-1.5">
          PulseCP <span class="text-xs px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-400 font-medium">v1.0</span>
        </h1>
        <p class="text-xs text-slate-400">Live CP Contest Alerter</p>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <button onclick="triggerTestAlert()" id="testAlertBtn" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold text-white transition active:scale-95 shadow-lg shadow-indigo-600/20">
        <i data-lucide="bell" class="w-3.5 h-3.5"></i>
        <span>Test Alert</span>
      </button>
      <button onclick="fetchContests()" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition active:scale-95">
        <i data-lucide="refresh-cw" class="w-4 h-4" id="refreshIcon"></i>
      </button>
    </div>
  </header>

  <!-- Toast Notification Banner -->
  <div id="toast" class="fixed top-16 left-4 right-4 z-50 transform -translate-y-20 opacity-0 transition-all duration-300 pointer-events-none max-w-md mx-auto">
    <div id="toastContent" class="glass-card px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 border-l-4 border-indigo-500">
      <i data-lucide="info" class="w-5 h-5 text-indigo-400 shrink-0" id="toastIcon"></i>
      <span class="text-xs font-medium text-slate-200" id="toastMessage">Notification message here</span>
    </div>
  </div>

  <!-- Main Container -->
  <main class="max-w-xl w-full mx-auto p-4 space-y-5 flex-1">

    <!-- Platform Filter Tabs -->
    <div class="flex items-center space-x-2 overflow-x-auto pb-1 no-scrollbar">
      <button onclick="filterContests('ALL')" class="platform-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white transition shrink-0" data-platform="ALL">All Platforms</button>
      <button onclick="filterContests('CODEFORCES')" class="platform-tab px-3.5 py-1.5 rounded-lg text-xs font-medium bg-slate-900 border border-slate-800 text-slate-400 hover:text-slate-200 transition shrink-0" data-platform="CODEFORCES">Codeforces</button>
      <button onclick="filterContests('LEETCODE')" class="platform-tab px-3.5 py-1.5 rounded-lg text-xs font-medium bg-slate-900 border border-slate-800 text-slate-400 hover:text-slate-200 transition shrink-0" data-platform="LEETCODE">LeetCode</button>
      <button onclick="filterContests('CODECHEF')" class="platform-tab px-3.5 py-1.5 rounded-lg text-xs font-medium bg-slate-900 border border-slate-800 text-slate-400 hover:text-slate-200 transition shrink-0" data-platform="CODECHEF">CodeChef</button>
      <button onclick="filterContests('ATCODER')" class="platform-tab px-3.5 py-1.5 rounded-lg text-xs font-medium bg-slate-900 border border-slate-800 text-slate-400 hover:text-slate-200 transition shrink-0" data-platform="ATCODER">AtCoder</button>
    </div>

    <!-- Contests Section -->
    <section class="space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
          <i data-lucide="calendar" class="w-3.5 h-3.5 text-indigo-400"></i> Upcoming Contests
        </h2>
        <span class="text-xs text-slate-500 font-medium" id="contestCount">Loading...</span>
      </div>

      <div id="contestsList" class="space-y-3">
        <!-- Dynamic Contest Cards Render Here -->
        <div class="glass-card p-6 rounded-xl text-center space-y-2">
          <div class="inline-block p-3 rounded-full bg-slate-800/80 animate-pulse text-indigo-400">
            <i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i>
          </div>
          <p class="text-xs text-slate-400">Syncing contests from platforms...</p>
        </div>
      </div>
    </section>

    <!-- User Channels & Settings Section -->
    <section class="space-y-3 pt-2">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
        <i data-lucide="settings" class="w-3.5 h-3.5 text-indigo-400"></i> Notification Channels
      </h2>

      <div class="glass-card rounded-xl p-4 space-y-3">
        <div class="flex items-center justify-between text-xs border-b border-slate-800/60 pb-2.5">
          <div class="flex items-center space-x-2.5">
            <div class="w-7 h-7 rounded-lg bg-orange-500/10 text-orange-400 flex items-center justify-center">
              <i data-lucide="smartphone" class="w-4 h-4"></i>
            </div>
            <div>
              <p class="font-semibold text-slate-200">Mobile Push (ntfy)</p>
              <p class="text-[11px] text-slate-400 truncate max-w-[180px]" id="ntfyTopicDisplay">afzal-cp-alerts-secret</p>
            </div>
          </div>
          <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-emerald-500/20 text-emerald-400">Active</span>
        </div>

        <div class="flex items-center justify-between text-xs border-b border-slate-800/60 pb-2.5">
          <div class="flex items-center space-x-2.5">
            <div class="w-7 h-7 rounded-lg bg-blue-500/10 text-blue-400 flex items-center justify-center">
              <i data-lucide="mail" class="w-4 h-4"></i>
            </div>
            <div>
              <p class="font-semibold text-slate-200">Email SMTP</p>
              <p class="text-[11px] text-slate-400 truncate max-w-[180px]" id="emailDisplay">mdafzal14777@gmail.com</p>
            </div>
          </div>
          <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-emerald-500/20 text-emerald-400">Active</span>
        </div>

        <div class="flex items-center justify-between text-xs">
          <div class="flex items-center space-x-2.5">
            <div class="w-7 h-7 rounded-lg bg-sky-500/10 text-sky-400 flex items-center justify-center">
              <i data-lucide="send" class="w-4 h-4"></i>
            </div>
            <div>
              <p class="font-semibold text-slate-200">Telegram Bot</p>
              <p class="text-[11px] text-slate-400 truncate max-w-[180px]" id="telegramDisplay">ID: 5645101857</p>
            </div>
          </div>
          <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-emerald-500/20 text-emerald-400">Active</span>
        </div>
      </div>
    </section>

  </main>

  <!-- Bottom Navigation Bar for Mobile PWA Feel -->
  <nav class="fixed bottom-0 left-0 right-0 glass-card border-t border-slate-800 px-6 py-3 flex items-center justify-around z-40 max-w-md mx-auto rounded-t-2xl">
    <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="flex flex-col items-center text-indigo-400 space-y-1">
      <i data-lucide="compass" class="w-5 h-5"></i>
      <span class="text-[10px] font-semibold">Discover</span>
    </button>
    <button onclick="triggerSync()" class="flex flex-col items-center text-slate-400 hover:text-indigo-400 transition space-y-1">
      <i data-lucide="refresh-cw" class="w-5 h-5" id="syncNavIcon"></i>
      <span class="text-[10px] font-medium">Sync Data</span>
    </button>
    <button onclick="showToast('PulseCP Engine is running 24/7 on background workers!', 'success')" class="flex flex-col items-center text-slate-400 hover:text-indigo-400 transition space-y-1">
      <i data-lucide="shield-check" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">System OK</span>
    </button>
  </nav>

  <!-- App Frontend Logic -->
  <script>
    const API_BASE = ''; // Same origin or http://localhost:4000
    const SEEDED_USER_ID = '714c557b-08a2-41c4-a93d-d5aee9677a07';
    let allContests = [];
    let currentFilter = 'ALL';

    // Platform badge color mapping
    const platformColors = {
      CODEFORCES: 'bg-amber-500/10 text-amber-400 border-amber-500/20',
      LEETCODE: 'bg-yellow-500/10 text-yellow-400 border-yellow-500/20',
      CODECHEF: 'bg-orange-500/10 text-orange-400 border-orange-500/20',
      ATCODER: 'bg-cyan-500/10 text-cyan-400 border-cyan-500/20'
    };

    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      const msgEl = document.getElementById('toastMessage');
      const iconEl = document.getElementById('toastIcon');
      
      msgEl.textContent = message;
      toast.classList.remove('-translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('-translate-y-20', 'opacity-0');
      }, 4000);
    }

    async function fetchContests() {
      const listEl = document.getElementById('contestsList');
      const countEl = document.getElementById('contestCount');
      
      try {
        const res = await fetch(`${API_BASE}/api/contests/upcoming`);
        const data = await res.json();
        
        allContests = data.contests || [];
        renderContests();
      } catch (err) {
        console.error(err);
        listEl.innerHTML = `
          <div class="glass-card p-6 rounded-xl text-center space-y-2 border-red-500/30">
            <i data-lucide="alert-triangle" class="w-6 h-6 text-red-400 mx-auto"></i>
            <p class="text-xs text-red-300 font-medium">Failed to connect to PulseCP API server.</p>
            <p class="text-[10px] text-slate-500">Ensure 'npm run dev:api' is running on port 4000.</p>
          </div>
        `;
        lucide.createIcons();
      }
    }

    function filterContests(platform) {
      currentFilter = platform;
      document.querySelectorAll('.platform-tab').forEach(btn => {
        if (btn.dataset.platform === platform) {
          btn.className = 'platform-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white transition shrink-0';
        } else {
          btn.className = 'platform-tab px-3.5 py-1.5 rounded-lg text-xs font-medium bg-slate-900 border border-slate-800 text-slate-400 hover:text-slate-200 transition shrink-0';
        }
      });
      renderContests();
    }

    function renderContests() {
      const listEl = document.getElementById('contestsList');
      const countEl = document.getElementById('contestCount');

      const filtered = currentFilter === 'ALL' 
        ? allContests 
        : allContests.filter(c => c.platform === currentFilter);

      countEl.textContent = `${filtered.length} contests`;

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div class="glass-card p-6 rounded-xl text-center space-y-2">
            <p class="text-xs text-slate-400">No upcoming contests found for ${currentFilter}</p>
          </div>
        `;
        return;
      }

      listEl.innerHTML = filtered.map(c => {
        const badgeStyle = platformColors[c.platform] || 'bg-slate-800 text-slate-300 border-slate-700';
        const durationHrs = (c.durationSeconds / 3600).toFixed(1);
        
        return `
          <div class="glass-card p-4 rounded-xl space-y-3 hover:border-indigo-500/40 transition">
            <div class="flex items-center justify-between">
              <span class="px-2.5 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider border ${badgeStyle}">
                ${c.platform}
              </span>
              <span class="text-[11px] text-slate-400 font-medium flex items-center gap-1">
                <i data-lucide="clock" class="w-3 h-3 text-indigo-400"></i> ${durationHrs} hrs
              </span>
            </div>

            <div>
              <h3 class="font-semibold text-sm text-slate-100 tracking-tight">${c.name}</h3>
              <p class="text-xs text-indigo-300 font-medium mt-1 flex items-center gap-1">
                <i data-lucide="calendar-days" class="w-3.5 h-3.5"></i> ${c.startTimeIst}
              </p>
            </div>

            <div class="flex items-center justify-between pt-1 border-t border-slate-800/60">
              <span class="text-[10px] text-emerald-400 font-medium flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span> Reminders armed (24h & 30m)
              </span>
              <a href="${c.url}" target="_blank" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 transition flex items-center gap-1.5">
                <span>View</span>
                <i data-lucide="external-link" class="w-3 h-3"></i>
              </a>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    async function triggerTestAlert() {
      const btn = document.getElementById('testAlertBtn');
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i><span>Sending...</span>`;
      lucide.createIcons();

      try {
        const res = await fetch(`${API_BASE}/api/preferences/${SEEDED_USER_ID}/test-alert`, {
          method: 'POST'
        });
        const data = await res.json();

        if (res.ok) {
          showToast(`Test alert sent for "${data.contestTested}" across all channels!`, 'success');
        } else {
          showToast(data.error || 'Failed to trigger test alert', 'error');
        }
      } catch (err) {
        console.error(err);
        showToast('Network error triggering test alert', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="bell" class="w-3.5 h-3.5"></i><span>Test Alert</span>`;
        lucide.createIcons();
      }
    }

    async function triggerSync() {
      const icon = document.getElementById('syncNavIcon');
      icon.classList.add('animate-spin');

      try {
        const res = await fetch(`${API_BASE}/api/contests/sync`, { method: 'POST' });
        const data = await res.json();
        if (res.ok) {
          showToast('Contests successfully synced from all 4 platforms!', 'success');
          fetchContests();
        } else {
          showToast('Sync completed with warnings', 'info');
        }
      } catch (err) {
        showToast('Failed to sync contests', 'error');
      } finally {
        icon.classList.remove('animate-spin');
      }
    }

    // Initial load
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      fetchContests();
    });
  </script>
</body>
</html>
