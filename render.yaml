services:
  # 1. Express REST API Service
  - type: web
    name: pulsecp-api
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: pulsecp-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: pulsecp-redis
          property: connectionString
      - key: NTFY_BASE_URL
        value: https://ntfy.sh
      - key: NTFY_DEFAULT_TOPIC
        value: afzal-cp-alerts-secret
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false # Set securely in Render Dashboard
      - key: SMTP_PASS
        sync: false # Set securely in Render Dashboard
      - key: TELEGRAM_BOT_TOKEN
        sync: false # Set securely in Render Dashboard

  # 2. BullMQ Background Worker Service
  - type: worker
    name: pulsecp-worker
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pulsecp-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: pulsecp-redis
          property: connectionString
      - key: NTFY_BASE_URL
        value: https://ntfy.sh
      - key: NTFY_DEFAULT_TOPIC
        value: afzal-cp-alerts-secret
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false

databases:
  - name: pulsecp-postgres
    databaseName: pulsecp_db
    user: pulsecp_user
    region: singapore
    plan: free

services:
  - type: redis
    name: pulsecp-redis
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction